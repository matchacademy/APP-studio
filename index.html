<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Farmacologia — Flashcard</title>
<style>
  :root{
    --paper: #f6f3ec;
    --paper-2: #efeadf;
    --ink: #232019;
    --ink-soft: #5c564a;
    --rule: #d9d2c1;
    --accent: #2f5d4f;
    --accent-2: #a3432f;
    --gold: #b8863b;
    --mono: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
    --serif: 'Source Serif 4', 'Iowan Old Style', Georgia, serif;
    --card-shadow: 0 1px 0 rgba(35,32,25,0.06), 0 8px 24px rgba(35,32,25,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #fbf9f3 0%, var(--paper) 55%),
      var(--paper);
    color:var(--ink);
    font-family: var(--serif);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 80px;
  }

  /* HEADER */
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 14px;
    margin-bottom: 26px;
    gap: 12px;
  }
  .header-left{
    display:flex;
    align-items:baseline;
    gap: 4px;
    min-width:0;
  }
  header h1{
    font-size: 1.28rem;
    font-weight: 600;
    margin:0;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  header h1 .rx{
    font-family: var(--mono);
    color: var(--accent);
    font-size: 0.95rem;
    margin-right: 8px;
    letter-spacing: 0.02em;
  }
  header .sub{
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .back-btn{
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--rule);
    padding: 8px 12px;
    border-radius: 3px;
    cursor:pointer;
    flex-shrink:0;
  }
  .back-btn:hover{ border-color: var(--accent); color: var(--accent); }

  .breadcrumb{
    font-family: var(--mono);
    font-size: 0.68rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 18px;
  }
  .breadcrumb b{ color: var(--accent); }

  /* HOME: MODULE CARDS */
  .module-grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .module-card{
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 30px 26px;
    cursor: pointer;
    box-shadow: var(--card-shadow);
    transition: transform .18s ease, border-color .18s ease;
    position: relative;
    overflow:hidden;
  }
  .module-card:hover{ transform: translateY(-2px); border-color: var(--accent); }
  .module-card::before{
    content:'';
    position:absolute;
    top:0; left:0;
    width:4px; height:100%;
    background: var(--accent);
  }
  .module-card .m-label{
    font-family: var(--mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .module-card h2{
    margin: 0 0 8px 0;
    font-size: 1.6rem;
    font-weight: 600;
  }
  .module-card .m-meta{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-soft);
  }
  .module-card .m-arrow{
    position:absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.6rem;
    color: var(--rule);
  }

  .empty-home{
    text-align:center;
    padding: 50px 20px;
    color: var(--ink-soft);
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height:1.7;
  }

  /* LESSON LIST */
  .lesson-list{
    display:flex;
    flex-direction: column;
    gap: 10px;
  }
  .lesson-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background: var(--paper-2);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 18px 20px;
    cursor:pointer;
    transition: border-color .15s ease, transform .15s ease;
  }
  .lesson-item:hover{ border-color: var(--accent); transform: translateX(2px); }
  .lesson-item .l-title{
    font-size: 1.05rem;
    font-weight: 600;
  }
  .lesson-item .l-count{
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
    white-space:nowrap;
    margin-left: 12px;
  }
  .lesson-item .l-progress{
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--accent);
    margin-top: 4px;
  }

  /* FILTERS (inside lesson view) */
  .filters{
    margin-bottom: 14px;
  }
  select, button.ctrl{
    font-family: var(--mono);
    font-size: 0.76rem;
    letter-spacing: 0.02em;
    border: 1px solid var(--rule);
    background: var(--paper-2);
    color: var(--ink);
    padding: 9px 12px;
    border-radius: 3px;
    cursor: pointer;
  }
  select{
    appearance: none;
    -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-soft) 50%), linear-gradient(135deg, var(--ink-soft) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 30px;
    width: 100%;
  }
  select:hover{ border-color: var(--accent); }

  .toolbar{
    display:flex;
    gap: 8px;
    margin: 10px 0 18px;
  }
  .toolbar button{ flex:1; }
  button.ctrl:hover{ border-color: var(--accent); }
  button.ctrl.toggle-on{
    background: var(--accent);
    color: var(--paper);
    border-color: var(--accent);
  }
  button.ctrl:active{ transform: translateY(1px); }

  .progress-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 20px;
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--ink-soft);
  }
  .progress-bar{
    flex:1;
    height: 4px;
    background: var(--rule);
    border-radius: 2px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: var(--accent);
    width:0%;
    transition: width .3s ease;
  }

  /* CARD */
  .stage{
    perspective: 1400px;
    margin-bottom: 22px;
  }
  .card{
    position:relative;
    min-height: 320px;
    border-radius: 6px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius: 6px;
    padding: 30px 26px;
    display:flex;
    flex-direction:column;
    box-shadow: var(--card-shadow);
    border: 1px solid var(--rule);
  }
  .face.front{
    background: var(--paper-2);
    justify-content:center;
    align-items:center;
    text-align:center;
  }
  .face.back{
    background: #fbf8f1;
    transform: rotateY(180deg);
    justify-content:flex-start;
  }
  .tag-row{
    display:flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 18px;
    justify-content:center;
  }
  .face.back .tag-row{ justify-content:flex-start; }
  .cat-tag{
    font-family: var(--mono);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 3px 7px;
    border-radius: 2px;
  }
  .front-term{
    font-size: 1.45rem;
    font-weight: 600;
    line-height:1.3;
  }
  .back-answer{
    font-size: 1.02rem;
    line-height: 1.55;
    color: var(--ink);
  }
  .flip-hint{
    position:absolute;
    bottom: 14px;
    right: 18px;
    font-family: var(--mono);
    font-size: 0.6rem;
    color: var(--ink-soft);
    text-transform:uppercase;
    letter-spacing: 0.08em;
  }
  .index-mark{
    position:absolute;
    top:14px;
    right:18px;
    font-family: var(--mono);
    font-size: 0.66rem;
    color: var(--ink-soft);
  }

  .actions{
    display:flex;
    gap: 10px;
  }
  .actions button{
    flex:1;
    padding: 13px 10px;
    font-size: 0.8rem;
    font-weight: 600;
  }
  .btn-no{
    border-color: var(--accent-2);
    color: var(--accent-2);
    background: #fbf3f0;
  }
  .btn-no:hover{ background: #f6e6e0; }
  .btn-yes{
    border-color: var(--accent);
    color: var(--paper);
    background: var(--accent);
  }
  .btn-yes:hover{ background: #26493e; }

  .nav-row{
    display:flex;
    justify-content:space-between;
    margin-top: 14px;
    gap: 10px;
  }
  .nav-row button{
    background: transparent;
    color: var(--ink-soft);
  }

  footer{
    margin-top: 30px;
    text-align:center;
    font-family: var(--mono);
    font-size: 0.62rem;
    color: var(--ink-soft);
    letter-spacing: 0.05em;
  }

  @media (max-width: 420px){
    .front-term{ font-size: 1.2rem; }
    .card{ min-height: 300px; }
    .module-card h2{ font-size: 1.35rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="header-left">
      <h1 id="pageTitle"><span class="rx">Rx/</span>Farmacologia</h1>
    </div>
    <button class="back-btn" id="backBtn" style="display:none;">← Indietro</button>
  </header>

  <div class="breadcrumb" id="breadcrumb"></div>

  <div id="app"></div>

  <footer>Farmacologia I — Plescia · Calascibetta</footer>
</div>

<script>
let CARDS = [];

async function loadCards(){
  const appEl = document.getElementById('app');
  appEl.innerHTML = `<div class="empty-home">Caricamento flashcard...</div>`;
  try{
    const manifestRes = await fetch('manifest.json');
    const manifest = await manifestRes.json();
    const files = manifest.files || [];

    const loaded = [];
    for(const filename of files){
      try{
        const res = await fetch(filename);
        const data = await res.json();
        const modulo = data.modulo;
        const lezione = data.lezione;
        for(const c of (data.cards || [])){
          loaded.push({ cat: c.cat, front: c.front, back: c.back, modulo, lezione });
        }
      } catch(err){
        console.error('Errore caricando', filename, err);
      }
    }
    CARDS = loaded;
  } catch(err){
    console.error('Errore caricando manifest.json', err);
    appEl.innerHTML = `<div class="empty-home">Errore nel caricamento dei dati.<br>Verifica che manifest.json sia presente nel repo.</div>`;
    return false;
  }
  return true;
}

const STORAGE_KEY = 'farmaco_flashcards_known_v3';
let known = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');

function cardId(c){ return c.modulo + '::' + c.lezione + '::' + c.cat + '::' + c.front; }
function uniq(arr){ return Array.from(new Set(arr)); }
function sortLezioni(arr){
  return arr.sort((a,b) => {
    const na = parseFloat(a); const nb = parseFloat(b);
    if(!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });
}

// ---- STATE ----
let view = 'home'; // 'home' | 'modulo' | 'lezione'
let currentModulo = null;
let currentLezione = null;
let currentCat = 'Tutte';
let deck = [];
let idx = 0;
let flipped = false;

const app = document.getElementById('app');
const pageTitle = document.getElementById('pageTitle');
const breadcrumb = document.getElementById('breadcrumb');
const backBtn = document.getElementById('backBtn');

backBtn.addEventListener('click', () => {
  if(view === 'lezione'){ goToModulo(currentModulo); }
  else if(view === 'modulo'){ goHome(); }
});

function goHome(){
  view = 'home';
  currentModulo = null;
  currentLezione = null;
  render();
}
function goToModulo(modulo){
  view = 'modulo';
  currentModulo = modulo;
  currentLezione = null;
  render();
}
function goToLezione(modulo, lezione){
  view = 'lezione';
  currentModulo = modulo;
  currentLezione = lezione;
  currentCat = 'Tutte';
  showKnown = false;
  buildDeck();
  render();
}

let showKnown = false; // se true, include anche le card già sapute nel mazzo

function buildDeck(){
  const pool = CARDS.filter(c => c.modulo === currentModulo && c.lezione === currentLezione);
  const catFiltered = currentCat === 'Tutte' ? pool : pool.filter(c => c.cat === currentCat);
  deck = showKnown ? catFiltered : catFiltered.filter(c => !known[cardId(c)]);
  idx = 0;
  flipped = false;
}

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ---- RENDER ROUTER ----
function render(){
  if(view === 'home') renderHome();
  else if(view === 'modulo') renderModulo();
  else if(view === 'lezione') renderLezione();
}

function renderHome(){
  pageTitle.innerHTML = `<span class="rx">Rx/</span>Farmacologia`;
  backBtn.style.display = 'none';
  breadcrumb.textContent = '';

  const moduli = uniq(CARDS.map(c => c.modulo));

  if(moduli.length === 0){
    app.innerHTML = `<div class="empty-home">Nessuna lezione caricata ancora.</div>`;
    return;
  }

  app.innerHTML = `
    <div class="module-grid">
      ${moduli.map(m => {
        const modCards = CARDS.filter(c => c.modulo === m);
        const nLezioni = uniq(modCards.map(c => c.lezione)).length;
        return `
          <div class="module-card" data-modulo="${m}">
            <div class="m-label">Modulo</div>
            <h2>${m}</h2>
            <div class="m-meta">${nLezioni} lezion${nLezioni === 1 ? 'e' : 'i'} · ${modCards.length} card</div>
            <div class="m-arrow">→</div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  app.querySelectorAll('.module-card').forEach(el => {
    el.addEventListener('click', () => goToModulo(el.dataset.modulo));
  });
}

function renderModulo(){
  pageTitle.innerHTML = `<span class="rx">Rx/</span>${currentModulo}`;
  backBtn.style.display = 'inline-block';
  breadcrumb.innerHTML = `<b>${currentModulo}</b>`;

  const modCards = CARDS.filter(c => c.modulo === currentModulo);
  const lezioni = sortLezioni(uniq(modCards.map(c => c.lezione)));

  app.innerHTML = `
    <div class="lesson-list">
      ${lezioni.map(l => {
        const lCards = modCards.filter(c => c.lezione === l);
        const knownCount = lCards.filter(c => known[cardId(c)]).length;
        return `
          <div class="lesson-item" data-lezione="${l}">
            <div>
              <div class="l-title">${l}</div>
              <div class="l-progress">${knownCount}/${lCards.length} sapute</div>
            </div>
            <div class="l-count">${lCards.length} card →</div>
          </div>
        `;
      }).join('')}
    </div>
  `;

  app.querySelectorAll('.lesson-item').forEach(el => {
    el.addEventListener('click', () => goToLezione(currentModulo, el.dataset.lezione));
  });
}

function renderLezione(){
  pageTitle.innerHTML = `<span class="rx">Rx/</span>${currentLezione}`;
  backBtn.style.display = 'inline-block';
  breadcrumb.innerHTML = `<b>${currentModulo}</b> / ${currentLezione}`;

  const pool = CARDS.filter(c => c.modulo === currentModulo && c.lezione === currentLezione);
  const cats = ['Tutte', ...uniq(pool.map(c => c.cat)).sort()];

  const catPool = currentCat === 'Tutte' ? pool : pool.filter(c => c.cat === currentCat);
  const totalInCat = catPool.length;
  const knownInCat = catPool.filter(c => known[cardId(c)]).length;

  const total = deck.length;

  let cardHtml = '';
  if(total === 0){
    cardHtml = knownInCat === totalInCat && totalInCat > 0
      ? `<div class="empty-home">Le hai sapute tutte! 🎉<br>Attiva "Mostra anche le sapute" per ripassarle.</div>`
      : `<div class="empty-home">Nessuna card in questo argomento.</div>`;
  } else {
    const c = deck[idx];
    const isKnown = !!known[cardId(c)];
    cardHtml = `
      <div class="stage">
        <div class="card ${flipped ? 'flipped' : ''}" id="flipCard">
          <div class="face front">
            <span class="index-mark">${idx+1}/${total}${isKnown ? ' ✓' : ''}</span>
            <div class="tag-row"><span class="cat-tag">${c.cat}</span></div>
            <div class="front-term">${c.front}</div>
            <span class="flip-hint">tocca per girare</span>
          </div>
          <div class="face back">
            <div class="tag-row"><span class="cat-tag">${c.cat}</span></div>
            <div class="back-answer">${c.back}</div>
            <span class="flip-hint">tocca per tornare</span>
          </div>
        </div>
      </div>
      <div class="actions">
        <button class="btn-no" id="noBtn">Non la so</button>
        <button class="btn-yes" id="yesBtn">La so</button>
      </div>
      <div class="nav-row">
        <button class="ctrl" id="prevBtn">← Precedente</button>
        <button class="ctrl" id="nextBtn">Successiva →</button>
      </div>
    `;
  }

  app.innerHTML = `
    <div class="filters">
      <select id="catFilter">
        ${cats.map(c => `<option value="${c}" ${c === currentCat ? 'selected' : ''}>${c === 'Tutte' ? 'Tutti gli argomenti' : c}</option>`).join('')}
      </select>
    </div>
    <div class="toolbar">
      <button class="ctrl" id="shuffleBtn">Mescola</button>
      <button class="ctrl" id="resetBtn">Reset progressi lezione</button>
    </div>
    <div class="toolbar">
      <button class="ctrl ${showKnown ? 'toggle-on' : ''}" id="toggleKnownBtn">${showKnown ? '✓ Mostra anche sapute' : 'Mostra anche sapute'}</button>
    </div>
    <div class="progress-row">
      <span>${total ? idx + 1 : 0} / ${total}${showKnown ? '' : ' da ripassare'}</span>
      <div class="progress-bar"><div class="progress-fill" style="width:${totalInCat ? (knownInCat/totalInCat)*100 : 0}%"></div></div>
      <span>${knownInCat}/${totalInCat} sapute</span>
    </div>
    ${cardHtml}
  `;

  document.getElementById('catFilter').addEventListener('change', (e) => {
    currentCat = e.target.value;
    buildDeck();
    render();
  });
  document.getElementById('toggleKnownBtn').addEventListener('click', () => {
    showKnown = !showKnown;
    buildDeck();
    render();
  });
  document.getElementById('shuffleBtn').addEventListener('click', () => {
    shuffle(deck);
    idx = 0;
    flipped = false;
    render();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    if(confirm('Azzerare i progressi di questa lezione?')){
      pool.forEach(c => { delete known[cardId(c)]; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(known));
      render();
    }
  });

  if(total > 0){
    const c = deck[idx];
    document.getElementById('flipCard').addEventListener('click', () => {
      flipped = !flipped;
      document.getElementById('flipCard').classList.toggle('flipped', flipped);
    });
    document.getElementById('yesBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      known[cardId(c)] = true;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(known));
      goNext();
    });
    document.getElementById('noBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      known[cardId(c)] = false;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(known));
      goNext();
    });
    document.getElementById('prevBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      goPrev();
    });
    document.getElementById('nextBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      goNext();
    });
  }
}

function goNext(){
  flipped = false;
  idx = deck.length ? (idx + 1) % deck.length : 0;
  render();
}
function goPrev(){
  flipped = false;
  idx = deck.length ? (idx - 1 + deck.length) % deck.length : 0;
  render();
}

document.addEventListener('keydown', (e) => {
  if(view !== 'lezione') return;
  if(e.code === 'Space'){
    e.preventDefault();
    flipped = !flipped;
    const el = document.getElementById('flipCard');
    if(el) el.classList.toggle('flipped', flipped);
  }
  if(e.code === 'ArrowRight') goNext();
  if(e.code === 'ArrowLeft') goPrev();
});

(async () => {
  const ok = await loadCards();
  if(ok) render();
})();
</script>
</body>
</html>
